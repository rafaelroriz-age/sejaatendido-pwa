name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight (VITE_API_URL)
        env:
          RESOLVED_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || secrets.VITE_API_URL }}
        run: |
          if [ -z "$RESOLVED_API_URL" ]; then
            echo "::warning::Secret VITE_API_URL (ou NEXT_PUBLIC_API_URL) nao configurado em Settings > Secrets and variables > Actions. O build vai usar o fallback hardcoded em src/config/api.ts, que hoje aponta para o backend correto, mas isso e fragil: configure o secret explicitamente para producao."
          else
            echo "Preflight OK: VITE_API_URL resolvido a partir dos secrets."
          fi

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || secrets.VITE_API_URL }}
          NEXT_PUBLIC_FRONTEND_URL: ${{ secrets.NEXT_PUBLIC_FRONTEND_URL }}
          VITE_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || secrets.VITE_API_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
