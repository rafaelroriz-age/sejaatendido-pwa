services:
  sejaatendido-pwa:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://sejaatendido-backend.onrender.com
        VITE_ASAAS_TOKENIZATION_KEY: ${VITE_ASAAS_TOKENIZATION_KEY:-}
        VITE_ASAAS_ENV: production
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
